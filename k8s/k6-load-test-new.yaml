---
# ConfigMap: k6 load test script
# Open-loop (constant-arrival-rate) test: fires a fixed number of requests per
# second regardless of how fast the server responds. Measures true completion
# time of all injected requests at each RPS level.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: ml-pipelines
data:
  load_test.js: |
    import http from "k6/http";
    import { check } from "k6";
    import { scenario as execScenario } from "k6/execution";
    import { Trend, Counter, Rate } from "k6/metrics";

    // =========================================================================
    // CONFIG – open-loop (constant-arrival-rate) stepped load test
    //
    // k6 fires exactly `rate` requests per second for `duration`, regardless of
    // server response time. If the server can't keep up, requests queue inside
    // k6 (VUs wait). No requests are dropped — timeout is 180s and
    // gracefulStop is 180s so every request completes or explicitly times out.
    //
    // Professor requirement: "send N requests per second and measure how long
    // it takes to complete all of them."
    // =========================================================================
    const RPS_LIST = [5, 10, 20, 30, 40, 50, 60, 80, 100];
    const DURATION = "60s";
    const COOLDOWN_SECONDS = 210;  // must be >= GRACEFUL_STOP to prevent stage bleed
    const GRACEFUL_STOP = "180s"; // matches timeout so timed-out requests show as failures
    // Pre-allocate all VUs at startup — avoids runtime goroutine allocation
    // overhead that causes CPU-throttle drops at high RPS.
    // Peak in-flight at 100 RPS: (100-48)*60 = 3,120 requests in-flight at end
    // of injection. Add 2x safety margin → 7,000 VUs.
    const PRE_ALLOCATED_VUS = 7000;
    const MAX_VUS = 7000;

    const BASE_URL =
      __ENV.OD_BASE_URL ||
      "http://object-detection.ml-pipelines.svc.cluster.local:8000";

    // =========================================================================
    // Build sequential scenarios (one per RPS level)
    // =========================================================================
    const scenarios = {};
    RPS_LIST.forEach((rps, i) => {
      scenarios[`rps_${rps}`] = {
        executor: "constant-arrival-rate",
        rate: rps,
        timeUnit: "1s",
        duration: DURATION,
        gracefulStop: GRACEFUL_STOP,
        preAllocatedVUs: PRE_ALLOCATED_VUS,
        maxVUs: MAX_VUS,
        startTime: `${i * (parseDurationSeconds(DURATION) + COOLDOWN_SECONDS)}s`,
      };
    });
    export const options = {
      scenarios,
      summaryTrendStats: ["p(50)", "p(90)", "p(95)", "p(99)", "avg", "min", "max"],
    };

    // =========================================================================
    // Per-stage custom metrics
    // =========================================================================
    const dur = {}, done = {}, ok = {};
    for (const rps of RPS_LIST) {
      dur[rps]  = new Trend(`http_duration_rps_${rps}`, true);
      done[rps] = new Counter(`http_done_rps_${rps}`);
      ok[rps]   = new Rate(`http_ok_rate_rps_${rps}`);
    }

    // =========================================================================
    // Load test images from disk (pre-downloaded by init container)
    // =========================================================================
    const images = [
      open("/data/image0.jpg", "b"),
      open("/data/image1.jpg", "b"),
    ];

    // =========================================================================
    // Test function – one HTTP POST per iteration (open-loop: k6 controls rate)
    // =========================================================================
    export default () => {
      const t0 = Date.now();
      let success = false;

      try {
        const img = images[Math.floor(Math.random() * images.length)];
        const payload = {
          file: http.file(img, "test.jpg", "image/jpeg"),
        };

        const res = http.post(`${BASE_URL}/detect-upload`, payload, {
          timeout: "180s",
          headers: { "X-Send-Time": String(Date.now()) },
        });

        success = check(res, {
          "status 200":         (r) => r.status === 200,
          "content-type image": (r) => (r.headers["Content-Type"] || "").includes("image"),
        });
      } catch (_) {
        success = false;
      }

      const dt = Date.now() - t0;

      const scen = execScenario.name;
      const rps = Number(scen.split("_")[1]);
      if (!Number.isNaN(rps)) {
        dur[rps].add(dt);
        done[rps].add(1);
        ok[rps].add(success);
      }
    };

    // =========================================================================
    // Helpers
    // =========================================================================
    function parseDurationSeconds(str) {
      const re = /(\d+)(ms|s|m|h)/g;
      let total = 0, m;
      while ((m = re.exec(str)) !== null) {
        const v = Number(m[1]);
        total += m[2] === "ms" ? v / 1000
             :  m[2] === "s"  ? v
             :  m[2] === "m"  ? v * 60
             :                   v * 3600;
      }
      return Math.round(total);
    }
    const DURATION_SECS = parseDurationSeconds(DURATION);

    // =========================================================================
    // Summary → CSV
    // =========================================================================
    export function handleSummary(data) {
      // actual_rps = completed/60 is misleading when completions spill past the 60s
      // injection window (gracefulStop). Use throughput_rps = completed/elapsed and
      // drain_time_s = max(0, max_ms/1000 - 60) to separate injection throughput
      // from drain behavior.
      let csv = "rps_target,throughput_rps,drain_time_s,p50_ms,p90_ms,p95_ms,p99_ms,avg_ms,min_ms,max_ms,completed,dropped,ok_count,fail_count,ok_rate\n";

      for (const rps of RPS_LIST) {
        const mDur  = data.metrics[`http_duration_rps_${rps}`];
        const mDone = data.metrics[`http_done_rps_${rps}`];
        const mOk   = data.metrics[`http_ok_rate_rps_${rps}`];

        const p50 = mDur && mDur.values ? mDur.values["p(50)"] : undefined;
        const p90 = mDur && mDur.values ? mDur.values["p(90)"] : undefined;
        const p95 = mDur && mDur.values ? mDur.values["p(95)"] : undefined;
        const p99 = mDur && mDur.values ? mDur.values["p(99)"] : undefined;
        const avg = mDur && mDur.values ? mDur.values["avg"] : undefined;
        const min = mDur && mDur.values ? mDur.values["min"] : undefined;
        const max = mDur && mDur.values ? mDur.values["max"] : undefined;

        const completed = (mDone && mDone.values ? (mDone.values.count || mDone.values.sum) : 0) || 0;
        const okCount   = (mOk && mOk.values ? mOk.values.passes : 0) || 0;
        const failCount = (mOk && mOk.values && mOk.values.fails !== undefined) ? mOk.values.fails : Math.max(0, completed - okCount);
        const okRate    = (mOk && mOk.values && mOk.values.rate !== undefined) ? mOk.values.rate : (completed ? okCount / completed : 0);

        // throughput_rps: completions per second of actual elapsed time (injection + drain).
        // More honest than completed/60 when gracefulStop completions are included.
        const elapsedS      = max !== undefined ? Math.max(max / 1000, DURATION_SECS) : DURATION_SECS;
        const throughputRps = elapsedS > 0 ? completed / elapsedS : 0;
        // drain_time_s: how long after the 60s injection window the last request took.
        // 0 = all completed within injection; >0 = queue was still draining.
        const drainTimeS    = max !== undefined ? Math.max(0, max / 1000 - DURATION_SECS) : 0;
        // dropped = iterations k6 could not start due to VU exhaustion (not server failures)
        const dropped       = Math.max(0, rps * DURATION_SECS - completed);

        csv += [
          rps,
          throughputRps.toFixed(2),
          drainTimeS.toFixed(1),
          p50 !== undefined ? p50.toFixed(2) : "",
          p90 !== undefined ? p90.toFixed(2) : "",
          p95 !== undefined ? p95.toFixed(2) : "",
          p99 !== undefined ? p99.toFixed(2) : "",
          avg !== undefined ? avg.toFixed(2) : "",
          min !== undefined ? min.toFixed(2) : "",
          max !== undefined ? max.toFixed(2) : "",
          completed,
          dropped,
          okCount,
          failCount,
          okRate.toFixed(4),
        ].join(",") + "\n";
      }

      return {
        "/output/results.csv": csv,
        stdout: csv,
      };
    }

---
# Job: runs k6 as a one-shot Kubernetes Job.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: ml-pipelines
  labels:
    app: k6-load-test
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: k6-load-test
    spec:
      restartPolicy: Never
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: object-detection
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: download-image
        image: curlimages/curl:8.5.0
        command: ["/bin/sh", "-c",
          "curl -fsSL -o /data/image0.jpg https://ultralytics.com/images/bus.jpg &&
           curl -fsSL -o /data/image1.jpg https://ultralytics.com/images/zidane.jpg"]
        volumeMounts:
        - name: test-data
          mountPath: /data
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      containers:
      - name: k6
        image: grafana/k6:0.51.0
        args:
          - run
          - --no-usage-report
          - /scripts/load_test.js
        env:
        - name: OD_BASE_URL
          value: "http://object-detection.ml-pipelines.svc.cluster.local:8000"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: test-data
          mountPath: /data
          readOnly: true
        - name: output
          mountPath: /output
        resources:
          requests:
            memory: "4Gi"
            cpu: "4"
          limits:
            memory: "8Gi"
            cpu: "8"
      volumes:
      - name: scripts
        configMap:
          name: k6-script
      - name: test-data
        emptyDir: {}
      - name: output
        emptyDir: {}
