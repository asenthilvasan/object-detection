---
# ConfigMap: k6 load test script
# Sends POST /detect-upload requests with a test JPEG pre-downloaded by an init container.
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-script
  namespace: ml-pipelines
data:
  load_test.js: |
    import http from "k6/http";
    import { check } from "k6";
    import { Trend, Rate, Counter } from "k6/metrics";
    // ---------------------------------------------------------------------------
    // Custom metrics
    // ---------------------------------------------------------------------------
    const inferenceLatency = new Trend("inference_latency_ms", true);
    const errorRate        = new Rate("error_rate");
    const requestCount     = new Counter("total_requests");

    // ---------------------------------------------------------------------------
    // Test configuration – requests per second via ramping-arrival-rate.
    // preAllocatedVUs: VUs kept warm to handle the target RPS.
    // maxVUs: hard cap; k6 warns if it needs more than preAllocatedVUs.
    // Rule of thumb: preAllocatedVUs ≈ target_rps × p99_latency_seconds
    // ---------------------------------------------------------------------------
    export const options = {
      scenarios: {
        constant_load: {
          executor: "ramping-arrival-rate",
          startRate: 0,
          timeUnit: "1s",
          preAllocatedVUs: 500,       // VUs pre-warmed (increase if k6 warns)
          maxVUs: 2500,                // absolute VU ceiling
          stages: [
            { duration: "5s",  target: 0  },  // 0 RPS for 5 seconds
            { duration: "30s",  target: 200},  
          ],
        },
      },
      thresholds: {
        // 95th-percentile latency must stay under 5 s
        "inference_latency_ms": ["p(95)<5000"],
        // Error rate must stay below 5 %
        "error_rate": ["rate<0.05"],
      },
    };

    // ---------------------------------------------------------------------------
    // Load the test image from disk (pre-downloaded by init container)
    // ---------------------------------------------------------------------------
    // Load 3 different images — prevents OS page cache from making preprocessing
    // appear artificially fast (happens when the same file is read every iteration)
    const images = [
      open("/data/image0.jpg", "b"),
      open("/data/image1.jpg", "b"),
    ];

    // ---------------------------------------------------------------------------
    // Default function: each VU iteration sends one /detect-upload request.
    // No sleep() – arrival rate is controlled by the executor above.
    // ---------------------------------------------------------------------------
    const BASE_URL =
      __ENV.OD_BASE_URL ||
      "http://object-detection.ml-pipelines.svc.cluster.local:8000";

    export default function () {
      // Pick a different image each iteration so preprocessing cost is realistic
      const img = images[Math.floor(Math.random() * images.length)];
      const payload = {
        file: http.file(img, "test.jpg", "image/jpeg"),
      };

      const start = Date.now();
      const res = http.post(`${BASE_URL}/detect-upload`, payload);
      const elapsed = Date.now() - start;

      const ok = check(res, {
        "status 200":          (r) => r.status === 200,
        "content-type image":  (r) => (r.headers["Content-Type"] || "").includes("image"),
        "latency < 10s":       () => elapsed < 10000,
      });

      inferenceLatency.add(elapsed);
      errorRate.add(!ok);
      requestCount.add(1);
    }

---
# Job: runs k6 as a one-shot Kubernetes Job.
# Pin to the same node as the server for minimal network variance (same pattern
# as the existing same-node-testing runbook).  Remove nodeSelector if you want
# the scheduler to place it freely.
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-load-test
  namespace: ml-pipelines
  labels:
    app: k6-load-test
spec:
  # Set to 0 to prevent automatic retries on failure
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: k6-load-test
    spec:
      restartPolicy: Never
      # Optional: pin to the same node as the object-detection pod.
      # Replace the hostname value or remove this block to let k8s schedule freely.
      # nodeSelector:
      #   kubernetes.io/hostname: rci-tide-gpu-01.sdsu.edu
      initContainers:
      - name: download-image
        image: curlimages/curl:8.5.0
        # Download 3 distinct images so each request hits a different file
        command: ["/bin/sh", "-c",
          "curl -fsSL -o /data/image0.jpg https://ultralytics.com/images/bus.jpg &&
           curl -fsSL -o /data/image1.jpg https://ultralytics.com/images/zidane.jpg"]
        volumeMounts:
        - name: test-data
          mountPath: /data
      containers:
      - name: k6
        image: grafana/k6:0.51.0
        args:
          - run
          - /scripts/load_test.js
          - --out
          - json=/tmp/k6-results.json
        env:
        - name: OD_BASE_URL
          value: "http://object-detection.ml-pipelines.svc.cluster.local:8000"
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: test-data
          mountPath: /data
          readOnly: true
        resources:
          requests:
            memory: "2Gi"
            cpu: "2"
          limits:
            memory: "4Gi"
            cpu: "4"
      volumes:
      - name: scripts
        configMap:
          name: k6-script
      - name: test-data
        emptyDir: {}
