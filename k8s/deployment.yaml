apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-detection
  namespace: ml-pipelines
  labels:
    app: object-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-detection
  template:
    metadata:
      labels:
        app: object-detection
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      tolerations:
      - key: "nautilus.io/issue"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: object-detection
        image: alexanderlio/object-detection:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8265
          name: ray-dashboard
        - containerPort: 8080
          name: ray-metrics
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
          limits:
            memory: "16Gi"
            cpu: "8"
            nvidia.com/gpu: 1  # Request 1 GPU
        env:
        - name: RAY_METRICS_REPORT_INTERVAL_MS
          value: "1000"  # Ray samples GPU every 1s (default 10s) — required for trustworthy GPU graphs
        readinessProbe:
          httpGet:
            path: /-/routes
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: object-detection
  namespace: ml-pipelines
spec:
  selector:
    app: object-detection
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: ray-dashboard
    port: 8265
    targetPort: 8265
  - name: ray-metrics
    port: 8080
    targetPort: 8080
  type: ClusterIP
