apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-detection
  namespace: ml-pipelines
  labels:
    app: object-detection
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-detection
  template:
    metadata:
      labels:
        app: object-detection
    spec:
      nodeSelector:
        nvidia.com/gpu.product: NVIDIA-L40
      tolerations:
      - key: "nautilus.io/issue"
        operator: "Exists"
        effect: "NoSchedule"
      containers:
      - name: object-detection
        image: alexanderlio/object-detection:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8265
          name: ray-dashboard
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "8Gi"
            cpu: "4"
            nvidia.com/gpu: 1  # Request 1 GPU
        readinessProbe:
          httpGet:
            path: /detect?image_url=https://ultralytics.com/images/bus.jpg
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: object-detection
  namespace: ml-pipelines
spec:
  selector:
    app: object-detection
  ports:
  - name: http
    port: 8000
    targetPort: 8000
  - name: ray-dashboard
    port: 8265
    targetPort: 8265
  type: ClusterIP
